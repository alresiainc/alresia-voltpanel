name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build UI
        run: |
          sudo npm -g i pnpm
          make ui-build
      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Integration Test
        run: bash scripts/integration_test.sh

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Only internal/... is checked here: cmd/voltpanel embeds ui/dist,
      # which is only populated by the UI build step above.
      - name: Vet internal packages
        run: go vet ./internal/...
      - name: Test internal packages
        run: go test ./internal/...
